apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-control-plane-metrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-control-plane-metrics
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-control-plane-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-control-plane-metrics
subjects:
- kind: ServiceAccount
  name: k3s-control-plane-metrics
  namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-control-plane-metrics
  namespace: observability
data:
  scrape.yaml: "global:\n  scrape_interval: 30s\n  scrape_timeout: 10s\nscrape_configs:\n\
    - job_name: kube-etcd\n  static_configs:\n  - targets:\n    - 127.0.0.1:2381\n\
    \    labels:\n      namespace: kube-system\n  metric_relabel_configs:\n  - source_labels:\n\
    \    - __name__\n    regex: etcd_.*|grpc_.*\n    action: keep\n- job_name: kube-controller-manager\n\
    \  static_configs:\n  - targets:\n    - 127.0.0.1:10257\n    labels:\n      namespace:\
    \ kube-system\n  metric_relabel_configs:\n  - source_labels:\n    - __name__\n\
    \    regex: workqueue_.*|rest_client_.*|leader_election_.*|process_.*|go_.*|.*controller.*|namespace_.*\n\
    \    action: keep\n  scheme: https\n  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \  tls_config:\n    insecure_skip_verify: true\n- job_name: kube-scheduler\n \
    \ static_configs:\n  - targets:\n    - 127.0.0.1:10259\n    labels:\n      namespace:\
    \ kube-system\n  metric_relabel_configs:\n  - source_labels:\n    - __name__\n\
    \    regex: scheduler_.*|scheduling_.*|workqueue_.*|rest_client_.*|leader_election_.*|process_.*|go_.*\n\
    \    action: keep\n  scheme: https\n  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \  tls_config:\n    insecure_skip_verify: true\n- job_name: k3s-control-plane-metrics\n\
    \  static_configs:\n  - targets:\n    - 127.0.0.1:8429\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3s-control-plane-metrics
  namespace: observability
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: k3s-control-plane-metrics
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: k3s-control-plane-metrics
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: 'true'
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.150.0
        args:
        - -promscrape.config=/etc/vmagent/scrape.yaml
        - -remoteWrite.url=http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/api/v1/write
        - -remoteWrite.label=instance=$(NODE_NAME)
        - -remoteWrite.tmpDataPath=/queue
        - -remoteWrite.maxDiskUsagePerURL=512MiB
        - -httpListenAddr=127.0.0.1:8429
        - -memory.allowedBytes=128MiB
        - -promscrape.configCheckInterval=30s
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/vmagent
          readOnly: true
        - name: queue
          mountPath: /queue
        livenessProbe:
          exec:
            command:
            - wget
            - -q
            - -O
            - /dev/null
            - http://127.0.0.1:8429/health
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - wget
            - -q
            - -O
            - /dev/null
            - http://127.0.0.1:8429/health
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: k3s-control-plane-metrics
      - name: queue
        emptyDir:
          sizeLimit: 1Gi
