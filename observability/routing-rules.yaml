apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: lab-routing-health
  namespace: observability
spec:
  groups:
  - name: lab-routing-health
    rules:
    - alert: LabBGPNotUp
      expr: snmp_bgp_peer_state{job="snmp",vrf!=""} != 6
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: BGP reports a non-up state
        description: '{{ $labels.device }} VRF {{ $labels.vrf }}, peer {{ $labels.peer
          }} reports state {{ $value }}. Inspect the CLI for the reason.'
      record: ''
    - alert: LabISISNotUp
      expr: snmp_isis_adjacency_state{job="snmp"} != 3
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: ISIS reports a non-up state
        description: '{{ $labels.device }} reports state {{ $value }}. Inspect routing
          in the CLI; polling does not provide the reason for this transition.'
      record: ''
    - alert: LabBFDNotUp
      expr: snmp_bfd_session_state{job="snmp"} != 4
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: BFD reports a non-up state
        description: '{{ $labels.device }} reports state {{ $value }}. Inspect routing
          in the CLI; polling does not provide the reason for this transition.'
      record: ''
    - alert: LabBGPCoverage
      expr: (count(snmp_bgp_peer_state{job="snmp",vrf="default",device="BORDER1"})
        or vector(0)) < 2
      for: 5m
      labels:
        severity: warning
        device: BORDER1
        vrf: default
      annotations:
        summary: BGP polling has fewer rows than the verified baseline
        description: Expected at least 2 BGP rows on BORDER1. Check missing peers,
          SNMP access and collector errors. Update this Git baseline after intentional
          topology changes. BFD rows are per application, not unique sessions.
      record: ''
    - alert: LabISISCoverage
      expr: (count(snmp_isis_adjacency_state{job="snmp",device="BORDER1"}) or vector(0))
        < 2
      for: 5m
      labels:
        severity: warning
        device: BORDER1
      annotations:
        summary: ISIS polling has fewer rows than the verified baseline
        description: Expected at least 2 ISIS rows on BORDER1. Check missing peers,
          SNMP access and collector errors. Update this Git baseline after intentional
          topology changes. BFD rows are per application, not unique sessions.
      record: ''
    - alert: LabBFDCoverage
