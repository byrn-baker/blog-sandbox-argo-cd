apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: lab-component-health
  namespace: observability
spec:
  groups:
  - name: lab-component-health
    rules:
    - alert: LabKubeEtcdCoverage
      expr: (sum(up{job="kube-etcd"}) or vector(0)) < 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Incomplete kube-etcd monitoring
        description: Expected three successful kube-etcd targets, one per master.
          Check the local metrics DaemonSet and its remote-write queue.
      record: ''
    - alert: LabKubeSchedulerCoverage
      expr: (sum(up{job="kube-scheduler"}) or vector(0)) < 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Incomplete kube-scheduler monitoring
        description: Expected three successful kube-scheduler targets, one per master.
          Check the local metrics DaemonSet and its remote-write queue.
      record: ''
    - alert: LabKubeControllerManagerCoverage
      expr: (sum(up{job="kube-controller-manager"}) or vector(0)) < 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Incomplete kube-controller-manager monitoring
        description: Expected three successful kube-controller-manager targets, one
          per master. Check the local metrics DaemonSet and its remote-write queue.
      record: ''
    - alert: LabLonghornMetricsCoverage
      expr: (sum(up{job="longhorn"}) or vector(0)) < 6
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Longhorn monitoring is incomplete
        description: Expected six successful manager scrapes. Check NetworkPolicy,
          endpoints and the VMServiceScrape.
      record: ''
    - alert: LabLonghornVolumeUnhealthy
      expr: longhorn_volume_robustness{state=~"degraded|faulted|unknown"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Longhorn volume is not healthy
        description: PVC {{ $labels.pvc }} is {{ $labels.state }}. Inspect replicas
          before deleting or salvaging anything.
      record: ''
    - alert: LabLonghornReplicaError
      expr: longhorn_engine_replica_mode{mode="ERR"} == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Longhorn engine reports a failed replica
        description: Volume {{ $labels.volume }} replica {{ $labels.replica }} is
          in ERR mode.
      record: ''
    - alert: LabArgoMetricsCoverage
      expr: (sum(up{job=~"argocd-.*"}) or vector(0)) < 5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Argo CD monitoring is incomplete
        description: Expected five component targets. Check metrics listeners and
          NetworkPolicy.
      record: ''
    - alert: LabLonghornCSIRestarts
      expr: increase(kube_pod_container_status_restarts_total{namespace="longhorn-system",pod=~"csi-.*"}[15m])
        > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Longhorn CSI container restarted
        description: '{{ $labels.pod }} / {{ $labels.container }} restarted. Correlate
          its previous logs with API latency and etcd metrics.'
      record: ''
