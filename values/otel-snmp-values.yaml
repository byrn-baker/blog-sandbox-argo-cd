      \        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"\
      targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"\
      snmp_device_uptime_ticks{device=~\\\"$device\\\"} / 100\",\n          \"instant\"\
      : true,\n          \"format\": \"table\"\n        }\n      ],\n      \"fieldConfig\"\
