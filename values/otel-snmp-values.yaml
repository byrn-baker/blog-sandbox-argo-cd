      : {\n        \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\"\
      : 8\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n\
      \          \"expr\": \"rate(snmp_interface_out_octets_total{device=~\\\"$device\\\
      \",interface=~\\\"$interface\\\"}[5m]) * 8\",\n          \"instant\": false,\n\
      \          \"format\": \"time_series\"\n        }\n      ],\n      \"fieldConfig\"\
      : {\n        \"defaults\": {\n          \"unit\": \"bps\"\n        },\n    \
      \    \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n   \
      \   \"id\": 5,\n      \"title\": \"Inbound utilization\",\n      \"type\": \"\
