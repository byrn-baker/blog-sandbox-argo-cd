      \ \"prometheus\",\n        \"uid\": \"network-snmp\"\n      },\n      \"description\"\
      : \"\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 32,\n    \
      \    \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n\
      \          \"refId\": \"A\",\n          \"expr\": \"rate(snmp_interface_out_discards_total{device=~\\\
      \"$device\\\",interface=~\\\"$interface\\\"}[5m])\",\n          \"instant\"\
      : false,\n          \"format\": \"time_series\"\n        }\n      ],\n     \
