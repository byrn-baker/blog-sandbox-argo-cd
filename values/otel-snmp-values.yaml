- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: network-snmp-datasource
    namespace: observability
    labels:
      grafana_datasource: '1'
  data:
    network-snmp.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  editable:\
      \ false\n  isDefault: false\n  jsonData:\n    httpMethod: POST\n    timeInterval:\
      \ 60s\n  name: Network SNMP (547 days)\n  type: prometheus\n  uid: network-snmp\n\
      \  url: http://snmp-metrics.observability.svc:8428\n"
- apiVersion: operator.victoriametrics.com/v1beta1
  kind: VMServiceScrape
  metadata:
    name: otel-snmp
    namespace: observability
  spec:
    selector:
      matchLabels:
        app.kubernetes.io/instance: otel-snmp
    endpoints:
    - port: metrics
      interval: 30s
- apiVersion: operator.victoriametrics.com/v1beta1
  kind: VMServiceScrape
  metadata:
    name: snmp-metrics
    namespace: observability
  spec:
    selector:
      matchLabels:
        app.kubernetes.io/instance: snmp-metrics
    endpoints:
    - port: http
      interval: 30s
