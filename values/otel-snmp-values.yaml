extraManifests:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: network-snmp-dashboard
    namespace: observability
    labels:
      grafana_dashboard: '1'
  data:
    network-snmp.json: "{\n  \"uid\": \"network-snmp\",\n  \"title\": \"Network SNMP\"\
      ,\n  \"tags\": [\n    \"network\",\n    \"snmp\"\n  ],\n  \"schemaVersion\"\
      : 39,\n  \"version\": 1,\n  \"editable\": false,\n  \"timezone\": \"browser\"\
      ,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"\
      to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\"\
      : \"Devices polled in the last 3 minutes (expected 28)\",\n      \"type\": \"\
      stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n      \
      \  \"uid\": \"network-snmp\"\n      },\n      \"description\": \"\",\n     \
      \ \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n\
      \        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\"\
      : \"A\",\n          \"expr\": \"count(max by (device) (timestamp(snmp_device_uptime_ticks{job=\\\
      \"snmp\\\"})) > time() - 180) or vector(0)\",\n          \"instant\": true,\n\
      \          \"format\": \"time_series\"\n        }\n      ],\n      \"fieldConfig\"\
      : {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n  \
      \      \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n \
      \     \"id\": 2,\n      \"title\": \"Device uptime\",\n      \"type\": \"table\"\
      ,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\"\
      : \"network-snmp\"\n      },\n      \"description\": \"SNMP sysUpTime is hundredths\
      \ of a second and wraps after about 497 days.\",\n      \"gridPos\": {\n   \
      \     \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n\
      \      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n  \
      \        \"expr\": \"snmp_device_uptime_ticks{job=\\\"snmp\\\",device=~\\\"\
      $device\\\"} / 100\",\n          \"instant\": true,\n          \"format\": \"\
      table\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\"\
      : {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n    \
      \  },\n      \"options\": {}\n    },\n    {\n      \"id\": 3,\n      \"title\"\
      : \"Inbound traffic\",\n      \"type\": \"timeseries\",\n      \"datasource\"\
      : {\n        \"type\": \"prometheus\",\n        \"uid\": \"network-snmp\"\n\
      \      },\n      \"description\": \"\",\n      \"gridPos\": {\n        \"x\"\
      : 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n  \
      \    \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
      : \"rate(snmp_interface_in_octets_total{job=\\\"snmp\\\",if_type!=\\\"\\\",device=~\\\
      \"$device\\\",interface=~\\\"$interface\\\"}[5m]) * 8\",\n          \"instant\"\
      : false,\n          \"format\": \"time_series\"\n        }\n      ],\n     \
      \ \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bps\"\n\
      \        },\n        \"overrides\": []\n      },\n      \"options\": {}\n  \
      \  },\n    {\n      \"id\": 4,\n      \"title\": \"Outbound traffic\",\n   \
      \   \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"\
      prometheus\",\n        \"uid\": \"network-snmp\"\n      },\n      \"description\"\
      : \"\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n     \
      \   \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n\
      \          \"refId\": \"A\",\n          \"expr\": \"rate(snmp_interface_out_octets_total{job=\\\
      \"snmp\\\",if_type!=\\\"\\\",device=~\\\"$device\\\",interface=~\\\"$interface\\\
      \"}[5m]) * 8\",\n          \"instant\": false,\n          \"format\": \"time_series\"\
      \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n \
      \         \"unit\": \"bps\"\n        },\n        \"overrides\": []\n      },\n\
      \      \"options\": {}\n    },\n    {\n      \"id\": 5,\n      \"title\": \"\
