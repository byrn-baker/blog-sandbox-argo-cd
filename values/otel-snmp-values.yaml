  kind: VMRule
  metadata:
    name: network-snmp
    namespace: observability
  spec:
    groups:
    - name: network-snmp-freshness
      rules:
      - alert: NetworkSnmpDeviceStale
        expr: absent_over_time(snmp_device_uptime_ticks{device="CE1"}[3m])
        for: 2m
        labels:
          severity: warning
          device: CE1
        annotations:
          summary: CE1 has no fresh SNMP uptime sample
      - alert: NetworkSnmpDeviceStale
        expr: absent_over_time(snmp_device_uptime_ticks{device="DCA-Leaf01"}[3m])
        for: 2m
        labels:
          severity: warning
          device: DCA-Leaf01
        annotations:
          summary: DCA-Leaf01 has no fresh SNMP uptime sample
