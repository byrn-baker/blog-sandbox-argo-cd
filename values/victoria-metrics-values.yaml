# =============================================================================
# victoria-metrics-k8s-stack values: single-node VM + Grafana, DC-B/DC-C only
# =============================================================================
# Chart: victoria-metrics-k8s-stack 0.91.2, from the lab Helm mirror
# (http://192.168.3.21:8888/helm/victoria-metrics-k8s-stack-0.91.2.tgz).
#
# Pulled with `helm repo add vm https://victoriametrics.github.io/helm-charts/`
# rather than the OCI path in the chart's own Chart.yaml
# (oci://ghcr.io/victoriametrics/helm-charts/...). The upstream master branch
# is on 0.92.0 but that version isn't published as an OCI artifact yet
# (confirmed: `helm pull oci://...--version 0.92.0` returns "not found", while
# `helm search repo vm/victoria-metrics-k8s-stack -l` lists 0.91.2 as the
# newest actually-published release). Using the real latest, not the
# in-progress one.
#
# No nodeSelector/toleration override, same reasoning as
# values/longhorn-values.yaml: DC-A's control-plane taint keeps every
# component here out of DC-A without any config on this end.

vmsingle:
  spec:
    storage:
      # Cluster's only default StorageClass is k3s's built-in local-path
      # (confirmed: `kubectl get storageclass` showed it marked (default)).
      # Without this override VMSingle's PVC binds to local-path.
      # local-path ties the volume's data to whichever single node
      # provisioned it, with no replication, which defeats the point of
      # deploying Longhorn in the same app-of-apps run right before this.
      storageClassName: longhorn
      resources:
        requests:
          # Chart default (20Gi) kept as-is: a lab-scale scrape target (K8s
          # cluster metrics + 38 network devices via snmp_exporter, added in
          # a later step) fits comfortably at 1-month retention.
          storage: 20Gi

grafana:
  # Reach Grafana through existing node management addresses without a tunnel.
  service:
    type: NodePort
    nodePort: 30300
    externalTrafficPolicy: Cluster
  persistence:
    # Chart default is false (ephemeral emptyDir). Turned on because we now
    # have real replicated storage to put it on: without this, dashboards,
    # datasources, and any manual edits made in the UI vanish on every pod
    # restart, which would undermine the Part 7 SNMP-dashboard verification
    # step if the pod moved nodes between deploy and check.
    enabled: true
    type: pvc
    storageClassName: longhorn
    size: 2Gi

victoria-metrics-operator:
  # The operator does its own leader election against the API server
  # (controller-runtime's default: 15s lease-duration, 10s renew-deadline),
  # completely separate from k3s's embedded kube-controller-manager/scheduler.
  # It hit the exact same fatal pattern those did: an etcd apply occasionally
  # takes 5-10s on this fabric, the lease renewal times out, and the operator
  # treats that as fatal ("cannot start controller manager: leader election
  # lost") and exits - 48 restarts over 9h before this was set. Widening to
  # match the k3s-side fix (ansible/group_vars/k3s_cluster.yml,
  # k3s_leader_elect_lease_duration/renew_deadline) gives the same slow
  # applies more room before a lease loss is declared fatal.
  extraArgs:
    leader-elect-lease-duration: 30s
    leader-elect-renew-deadline: 20s

kube-state-metrics:
  # Chart default is resources: {}, no request/limit at all - deliberate per
  # the subchart's own values.yaml comment ("leave this as a conscious
  # choice for the user"). Left unset, this pod crash-looped for 7+ hours
  # (23 restarts) on an otherwise-idle node (cluster-wide CPU 1-4% at the
  # time): the process itself never errored (clean startup log, no panic,
  # no shutdown message - it just stops mid-log, consistent with an
  # external kill), but its liveness probe (5s timeout, 3 failures) kept
  # missing. With no CPU request, the container gets zero cgroup CPU
  # share guarantee, so it can go briefly starved even on an idle node if
  # anything else transient shares that CPU at the wrong moment, long
  # enough to blow a 5s HTTP response window. A small guaranteed request
  # fixes that without needing to touch the chart's probe timeouts (which
  # aren't exposed as a values override at this level anyway).
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
