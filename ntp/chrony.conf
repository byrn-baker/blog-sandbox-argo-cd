# Existing lab gateway. It synchronizes independently of this K3s service.
server 192.168.3.1 iburst minpoll 6 maxpoll 8

# Service port 123 maps to this unprivileged container port.
port 1123
allow 192.168.3.0/24
allow 10.0.0.0/8
ratelimit interval 1 burst 16

driftfile /var/lib/chrony/chrony.drift
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
cmdport 0

# No local-stratum fallback: advertise time only while synchronized.
