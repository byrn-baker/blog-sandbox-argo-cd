apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: telemetry-canary
  namespace: metallb-system
spec:
  addresses: ["{{ .Values.vip }}/32"]
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: telemetry-canary
  namespace: metallb-system
spec:
  ipAddressPools: [telemetry-canary]
  interfaces: [eth0]
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: dcb-k3s-w1
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-canary
  annotations:
    metallb.io/address-pool: telemetry-canary
    metallb.io/loadBalancerIPs: {{ .Values.vip | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: telemetry-canary
  ports:
    - {name: netflow, port: 2055, targetPort: 2055, protocol: UDP}
    - {name: sflow, port: 6343, targetPort: 6343, protocol: UDP}
    - {name: syslog, port: 514, targetPort: 5514, protocol: UDP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-canary
data:
  collector.yaml: |
    receivers:
      netflow:
        scheme: netflow
        port: 2055
        sockets: 1
        workers: 2
        queue_size: 1000
      netflow/sflow:
        scheme: sflow
        port: 6343
        sockets: 1
        workers: 2
        queue_size: 1000
      syslog:
        udp:
          listen_address: 0.0.0.0:5514
        protocol: rfc3164
        allow_skip_pri_header: true
        on_error: send
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      resource:
        attributes:
          - {key: service.name, value: telemetry-canary, action: upsert}
    exporters:
      otlp_http:
        logs_endpoint: http://victorialogs.observability.svc:9428/insert/opentelemetry/v1/logs
        compression: gzip
        timeout: 10s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 300s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [netflow, netflow/sflow, syslog]
          processors: [memory_limiter, resource]
          exporters: [otlp_http]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: telemetry-canary}
  template:
    metadata:
      labels: {app: telemetry-canary}
      annotations:
        lab.sandbox/config-revision: {{ .Values.configRevision | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: dcb-k3s-w1
      containers:
        - name: collector
          image: {{ .Values.image | quote }}
          args: ["--config=/conf/collector.yaml"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: 13133}
          livenessProbe:
            httpGet: {path: /, port: 13133}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: telemetry-canary}
