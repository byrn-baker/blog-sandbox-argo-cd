# =============================================================================
# Longhorn Application
# =============================================================================
# Discovered by root-app.yaml (bootstrap/root-app.yaml watches this apps/
# directory). Sync wave 1: after Argo CD itself (wave -1 implicitly, it's
# already running before this exists) but before victoria-metrics-k8s-stack
# (wave 2), since the VM stack's vmsingle/vmstorage PVCs request the
# "longhorn" StorageClass and would sit Pending if Longhorn's CRDs and
# StorageClass don't exist yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # repoURL must be the repo root serving index.yaml, not a direct link to
    # one chart's .tgz. Argo CD's repo-server always appends /index.yaml and
    # resolves `chart:` by name inside it (same as `helm repo add` +
    # `helm search repo`) - a raw .tgz URL 404s
    # (".../longhorn-1.12.1.tgz/index.yaml" doesn't exist). Confirmed by the
    # exact error on first apply, then fixed by regenerating
    # lab-mirror/helm/index.yaml with `helm repo index .` to include this
    # chart (it only had argo-cd's entry before). This is a different code
    # path from `helm pull <direct-tgz-url>`, which is what the Argo CD
    # install itself used and why that direct-URL pattern didn't carry over
    # cleanly here.
    - repoURL: http://192.168.3.21:8888/helm/
      targetRevision: 1.12.1
      chart: longhorn
      helm:
        valueFiles:
          - $values/values/longhorn-values.yaml
    - repoURL: https://github.com/byrn-baker/blog-sandbox-argo-cd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
