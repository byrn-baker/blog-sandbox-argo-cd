apiVersion: v1
kind: ServiceAccount
metadata:
  name: netclaw-assessor
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netclaw-assessor
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, services, endpoints, events, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments, csinodes, csidrivers]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [volumes, replicas, engines, nodes, instancemanagers, engineimages, backingimages, recurringjobs, settings]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netclaw-assessor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netclaw-assessor
subjects:
  - kind: ServiceAccount
    name: netclaw-assessor
    namespace: observability
---
# Kubernetes populates the token at runtime. No credential value belongs in Git.
apiVersion: v1
kind: Secret
metadata:
  name: netclaw-assessor-token
  namespace: observability
  annotations:
    kubernetes.io/service-account.name: netclaw-assessor
type: kubernetes.io/service-account-token
