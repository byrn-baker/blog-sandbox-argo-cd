apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ingress-management
  namespace: metallb-system
spec:
  ipAddressPools:
  - ingress-management
  interfaces:
  - eth0
  nodeSelectors:
  - matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
